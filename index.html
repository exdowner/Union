<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1013">
    <title>DevCord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AUTH -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo">DC</div>
                <h1>DevCord</h1>
                <p>Seu cantinho pra conversar, ligar e criar comunidades.</p>
            </div>
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Entrar</button>
                <button type="button" class="auth-tab" data-tab="register">Criar conta</button>
            </div>
            <form id="login-form" class="auth-form">
                <label>Email
                    <input type="email" id="login-email" required placeholder="voce@email.com" autocomplete="email">
                </label>
                <label>Senha
                    <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
                </label>
                <p class="auth-error" id="login-error"></p>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <form id="register-form" class="auth-form hidden">
                <label>Nome de exibição
                    <input type="text" id="register-name" required placeholder="Como te chamam" maxlength="32" autocomplete="nickname">
                </label>
                <label>Email
                    <input type="email" id="register-email" required placeholder="voce@email.com" autocomplete="email">
                </label>
                <label>Senha
                    <input type="password" id="register-password" required placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password">
                </label>
                <p class="auth-error" id="register-error"></p>
                <button type="submit" class="btn-primary">Criar conta</button>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="app" class="app hidden">
        <nav class="server-rail" id="server-rail" aria-label="Servidores">
            <button type="button" class="server-pill server-pill-home active" id="home-pill" title="Início">DC</button>
            <div class="server-divider"></div>
            <div class="server-list" id="server-list"></div>
            <button type="button" class="server-pill server-pill-add" id="add-server-btn" title="Criar servidor">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </nav>

        <aside class="channel-sidebar">
            <div class="server-header" id="server-header">
                <span id="current-server-name">Bem-vindo</span>
                <button type="button" id="server-settings-btn" class="icon-btn hidden" title="Configurações do servidor">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
            <div class="channel-groups" id="channel-groups">
                <p class="empty-hint">Crie ou entre em um servidor pra ver os canais aqui.</p>
            </div>
            <div class="user-card" id="user-card">
                <div class="user-card-avatar-wrap">
                    <img id="user-card-avatar" class="avatar avatar-sm" src="" alt="">
                    <span id="user-card-status-dot" class="status-dot status-online"></span>
                </div>
                <div class="user-card-info">
                    <span id="user-card-name">—</span>
                    <span id="user-card-status" class="user-card-status">Online</span>
                </div>
                <button type="button" id="open-profile-btn" class="icon-btn" title="Editar perfil">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
            </div>
        </aside>

        <main class="main-area">
            <header class="main-header">
                <span id="channel-title"># selecione-um-canal</span>
                <div class="main-header-actions">
                    <button type="button" id="call-btn" class="icon-btn hidden" title="Chamada de voz/vídeo">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </button>
                </div>
            </header>

            <section id="view-text" class="view">
                <div class="messages" id="messages"></div>
                <form id="message-form" class="message-form">
                    <button type="button" id="attach-btn" class="icon-btn" title="Anexar imagem">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                    <button type="button" id="sticker-btn" class="icon-btn" title="Figurinhas">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                    </button>
                    <input type="text" id="message-input" placeholder="Mandar mensagem..." autocomplete="off" maxlength="2000">
                    <button type="submit" class="btn-primary btn-send">Enviar</button>
                </form>
                <div id="sticker-picker" class="sticker-picker hidden">
                    <div class="sticker-picker-header">
                        <span>Figurinhas</span>
                        <label class="sticker-upload-btn" title="Adicionar figurinha">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                            <input type="file" id="sticker-upload-input" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div id="sticker-grid" class="sticker-grid"></div>
                </div>
                <div id="attach-preview" class="attach-preview hidden"></div>
            </section>

            <section id="view-voice" class="view hidden">
                <div class="voice-stage">
                    <h2 id="voice-channel-name">Canal de voz</h2>
                    <div class="voice-participants" id="voice-participants"></div>
                    <div class="voice-controls">
                        <button type="button" id="join-voice-btn" class="btn-primary">Entrar no canal de voz</button>
                        <button type="button" id="leave-voice-btn" class="btn-secondary hidden">Sair</button>
                        <button type="button" id="toggle-mic-btn" class="icon-btn hidden" title="Mutar/desmutar">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        </button>
                        <button type="button" id="toggle-cam-btn" class="icon-btn hidden" title="Câmera">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                        </button>
                    </div>
                    <div class="video-grid" id="video-grid"></div>
                </div>
            </section>

            <section id="view-forum" class="view hidden">
                <div class="forum-toolbar">
                    <button type="button" id="new-post-btn" class="btn-primary">Novo tópico</button>
                </div>
                <div class="forum-posts" id="forum-posts"></div>
                <div class="forum-thread hidden" id="forum-thread">
                    <button type="button" id="back-to-forum" class="btn-secondary">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Voltar
                    </button>
                    <div id="forum-thread-content"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAIS -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <!-- Criar servidor -->
        <div class="modal hidden" id="modal-create-server">
            <h2>Criar servidor</h2>
            <label>Nome do servidor
                <input type="text" id="new-server-name" maxlength="40" placeholder="Ex: Galera do Código">
            </label>
            <label>Ícone (opcional)
                <input type="file" id="new-server-icon" accept="image/*">
            </label>
            <div class="modal-actions">
                <button type="button" class="btn-secondary modal-cancel">Cancelar</button>
                <button type="button" class="btn-primary" id="confirm-create-server">Criar</button>
            </div>
        </div>

        <!-- Criar canal -->
        <div class="modal hidden" id="modal-create-channel">
            <h2>Criar canal</h2>
            <label>Nome do canal
                <input type="text" id="new-channel-name" maxlength="30" placeholder="ex: geral">
            </label>
            <label>Tipo
                <select id="new-channel-type">
                    <option value="text">Texto</option>
                    <option value="voice">Voz</option>
                    <option value="forum">Fórum</option>
                </select>
            </label>
            <div class="modal-actions">
                <button type="button" class="btn-secondary modal-cancel">Cancelar</button>
                <button type="button" class="btn-primary" id="confirm-create-channel">Criar</button>
            </div>
        </div>

        <!-- Perfil -->
        <div class="modal modal-profile hidden" id="modal-profile">
            <h2>Seu perfil</h2>
            <div class="profile-edit-preview">
                <div class="profile-banner" id="profile-banner-preview"></div>
                <img id="profile-avatar-preview" class="avatar avatar-lg" src="" alt="">
            </div>
            <label>Foto de perfil
                <input type="file" id="profile-avatar-input" accept="image/*">
            </label>
            <label>URL da foto (opcional)
                <input type="url" id="profile-avatar-url-input" placeholder="https://...">
            </label>
            <label>Banner
                <input type="file" id="profile-banner-input" accept="image/*">
            </label>
            <label>URL do banner (opcional)
                <input type="url" id="profile-banner-url-input" placeholder="https://...">
            </label>
            <label>Nome de exibição
                <input type="text" id="profile-name-input" maxlength="32">
            </label>
            <label>Bio
                <textarea id="profile-bio-input" maxlength="190" rows="3"></textarea>
            </label>
            <label>Status personalizado
                <input type="text" id="profile-status-input" maxlength="32" placeholder="Disponível">
            </label>
            <label>Status de presença
                <select id="profile-presence-input">
                    <option value="online">Online</option>
                    <option value="idle">Ausente</option>
                    <option value="dnd">Não perturbe</option>
                    <option value="invisible">Invisível</option>
                </select>
            </label>
            <label>Cor de destaque
                <input type="color" id="profile-color-input" value="#5ee6c4">
            </label>
            <label>Fonte do nick
                <select id="profile-font-input">
                    <option value="Inter">Padrão</option>
                    <option value="'Space Grotesk'">Space Grotesk</option>
                    <option value="'JetBrains Mono'">Mono</option>
                    <option value="cursive">Cursiva</option>
                </select>
            </label>
            <label>Redes sociais
                <input type="text" id="profile-social-input" placeholder="instagram.com/seuuser, github.com/seuuser">
            </label>
            <div class="modal-actions">
                <button type="button" class="btn-secondary modal-cancel">Cancelar</button>
                <button type="button" class="btn-primary" id="confirm-profile">Salvar</button>
            </div>
            <button type="button" class="btn-secondary logout-btn" id="logout-btn">Sair da conta</button>
        </div>

        <!-- Novo tópico -->
        <div class="modal hidden" id="modal-new-post">
            <h2>Novo tópico</h2>
            <label>Título
                <input type="text" id="new-post-title" maxlength="120">
            </label>
            <label>Conteúdo
                <textarea id="new-post-body" rows="5" maxlength="4000"></textarea>
            </label>
            <div class="modal-actions">
                <button type="button" class="btn-secondary modal-cancel">Cancelar</button>
                <button type="button" class="btn-primary" id="confirm-new-post">Publicar</button>
            </div>
        </div>

        <!-- Perfil público -->
        <div class="modal modal-public-profile hidden" id="modal-public-profile">
            <div class="public-profile-banner" id="public-profile-banner"></div>
            <img id="public-profile-avatar" class="avatar avatar-lg" src="" alt="">
            <h2 id="public-profile-name">—</h2>
            <p id="public-profile-status" class="public-status">Online</p>
            <p id="public-profile-bio" class="public-bio">Sem biografia.</p>
            <div id="public-profile-socials" class="public-socials"></div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary modal-cancel">Fechar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
